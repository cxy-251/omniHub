[project]
name = "omnihub-downloads"
version = "0.1.0"
description = "omniHub 下载任务脚本（yt-dlp、gallery-dl、漫画 jmcomic），由 Go 服务按需调用"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp==2026.8.19",
    "jmcomic==2.7.9",
    "gallery-dl==1.32.17",
    "mutagen==1.47.0",  # yt-dlp 给 opus/ogg 嵌入封面要用
    "ytmusicapi==1.12.3",  # 音乐：把 MV 换成纯音轨版、查专辑与曲序
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
