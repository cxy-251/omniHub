<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>omniHub</title>
    <link rel="stylesheet" href="/css/app.css">
    <link rel="stylesheet" href="/css/media.css">
    <link rel="stylesheet" href="/css/tasks.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <header>
        <div class="logo-area">
            <h1 class="logo-title">🎮 omniHub</h1>
            <span id="lib-status" class="badge badge-muted">检测中…</span>
        </div>
        <div class="header-status">
            <span id="user-badge" class="badge badge-muted">访客</span>
        </div>
    </header>

    <nav class="main-nav">
        <button class="active" data-tab="portal">🏛️ 门户大厅</button>
        <button data-tab="media">📖 媒体专区</button>
        <button data-tab="games">🕹️ 游戏专区</button>
        <button data-tab="tools">🛠️ 局域网小工具</button>
        <button data-tab="tasks">💻 任务调试台</button>
        <button data-tab="admin">⚙️ 权限管理</button>
    </nav>

    <main class="content-viewport">
        <!-- 门户大厅 -->
        <section id="pane-portal" class="tab-pane active">
            <div class="card-grid">
                <div class="card" onclick="Omni.switchTab('media')">
                    <h3>📖 媒体专区</h3>
                    <p>相册画廊 · 漫画条漫 · 小说与技术文档 · 全格式音频 · 短视频</p>
                </div>
                <div class="card" onclick="Omni.switchTab('games')">
                    <h3>🕹️ 游戏专区</h3>
                    <p>独立游戏 · 模拟器 · 星际争霸2 · 运行画像与时长记录</p>
                </div>
                <div class="card" onclick="Omni.switchTab('tools')">
                    <h3>🛠️ 局域网小工具</h3>
                    <p>跨设备剪贴板 · 共享文件传输 · 网络测速 · 网络唤醒 · 硬件监控</p>
                </div>
                <div class="card" onclick="Omni.switchTab('tasks')">
                    <h3>💻 任务调试台</h3>
                    <p>离线爬虫与打包脚本 · 实时日志视口与正则过滤</p>
                </div>
                <div class="card" onclick="Omni.switchTab('admin')">
                    <h3>⚙️ 权限管理</h3>
                    <p>全站分权矩阵配置 · 用户等级控制 · 会话即时失效</p>
                </div>
            </div>
        </section>

        <!-- 媒体专区占位 -->
        <section id="pane-media" class="tab-pane">
            <div id="media-container"></div>
        </section>

        <!-- 游戏专区占位 -->
        <section id="pane-games" class="tab-pane">
            <div id="games-container"></div>
        </section>

        <!-- 局域网小工具占位 -->
        <section id="pane-tools" class="tab-pane">
            <div id="tools-container"></div>
        </section>

        <!-- 任务调试台占位 -->
        <section id="pane-tasks" class="tab-pane">
            <div id="tasks-container"></div>
        </section>

        <!-- 权限管理占位 -->
        <section id="pane-admin" class="tab-pane">
            <div id="admin-container"></div>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script src="/js/media.js"></script>
    <script src="/js/tasks.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
